name: RX Lockfile Diagnostic

on:
  push:
    branches:
      - rx-transfer-4

permissions:
  contents: write

jobs:
  write-canonical-lockfile:
    name: Generate and write canonical Cargo.lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rx-transfer-4
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Prove only the lockfile changed
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -Eq '^ M Cargo\.lock$'
      - name: Commit canonical lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Generate canonical RX dependency lock (#4)"
          git push origin HEAD:rx-transfer-4
