name: RR23 path realization evaluation

on:
  pull_request:
    paths:
      - ".github/evaluations/rr23_path_realization.rs"
      - ".github/workflows/rr23-path-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: rr23-path-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: RR23-E1 Lyon vs Sparse Strips
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$EXPECTED_HEAD" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD"

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable

      - name: Materialize isolated evaluator
        run: |
          set -euo pipefail
          eval_dir=target/rr23-e1
          mkdir -p "$eval_dir/src"
          cp .github/evaluations/rr23_path_realization.rs "$eval_dir/src/main.rs"
          cat > "$eval_dir/Cargo.toml" <<'TOML'
          [package]
          name = "runenrender-rr23-e1"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.97.1"
          publish = false

          [workspace]

          [dependencies]
          lyon_tessellation = { version = "=1.0.22", default-features = false, features = ["std"] }
          vello_common = { version = "=0.3.0", default-features = false, features = ["std"] }
          TOML
          cargo +stable fmt --manifest-path "$eval_dir/Cargo.toml" -- --check
          cargo +stable generate-lockfile --manifest-path "$eval_dir/Cargo.toml"
          echo "temporary_lock_sha256=$(sha256sum "$eval_dir/Cargo.lock" | cut -d' ' -f1)"
          cargo +stable tree --manifest-path "$eval_dir/Cargo.toml" --locked -e normal

      - name: Build isolated evaluator
        run: |
          set -euo pipefail
          cargo +stable build \
            --manifest-path target/rr23-e1/Cargo.toml \
            --release \
            --locked

      - name: Run bounded path evaluation
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            target/rr23-e1/target/release/runenrender-rr23-e1 \
            2>&1 | tee target/rr23-e1-evidence.txt
          test -s target/rr23-e1-evidence.txt
          grep -q '^summary ' target/rr23-e1-evidence.txt

      - name: Check repository hygiene
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf 'RR23 evaluation changed tracked state:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rr23-e1-${{ github.event.pull_request.head.sha }}
          path: target/rr23-e1-evidence.txt
          if-no-files-found: error
          retention-days: 7
